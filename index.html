<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Sabrina's Umrah Guide</title>

<style>
/* Layout: one-handed phone app. Compact sticky header (name, gender switch, progress), a timeline of steps, and a fixed bottom tab bar for the five sections. */
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --surface-2:#F7F8F6; --ink:#12201F; --muted:#5D6B69; --faint:#8C9997; --line:#E1E6E2;
  --accent:#0F5E59; --accent-ink:#FFFFFF; --accent-soft:#E2EFEC; --brass:#9A7428; --brass-soft:#F6EEDB; --brass-line:#E5D3A6;
  --ok:#2E7D52; --ok-soft:#E3F2E9; --header:#0D3F3C; --header-ink:#F1F7F5;
  --shadow:0 1px 2px rgba(18,32,31,.05), 0 4px 16px rgba(18,32,31,.06);
  --ui:"Plus Jakarta Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
  --ar:"Amiri", "Noto Naskh Arabic", "Geeza Pro", serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0A1211; --surface:#121C1B; --surface-2:#172322; --ink:#E6EEEC; --muted:#95A5A2; --faint:#6E7F7C; --line:#22302E;
  --accent:#5CC2B4; --accent-ink:#06201D; --accent-soft:#143330; --brass:#D9B66C; --brass-soft:#272114; --brass-line:#4A3D20;
  --ok:#62CC93; --ok-soft:#14301F; --header:#0A1C1B; --header-ink:#E6EEEC;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.25); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0A1211; --surface:#121C1B; --surface-2:#172322; --ink:#E6EEEC; --muted:#95A5A2; --faint:#6E7F7C; --line:#22302E;
  --accent:#5CC2B4; --accent-ink:#06201D; --accent-soft:#143330; --brass:#D9B66C; --brass-soft:#272114; --brass-line:#4A3D20;
  --ok:#62CC93; --ok-soft:#14301F; --header:#0A1C1B; --header-ink:#E6EEEC;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.25); color-scheme:dark }

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--ui); font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased; }
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:40; background:var(--header); }
button{ font:inherit; color:inherit; }
:focus-visible{ outline:2px solid var(--brass); outline-offset:2px; }
.gutter{ padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); }
.wrap{ max-width:520px; margin:0 auto; }

/* Header */
.top{ position:sticky; top:env(safe-area-inset-top,0px); z-index:30; background:var(--header); color:var(--header-ink); }
.top .wrap{ padding-block:14px 12px; display:grid; gap:12px; }
.brand-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
.brand{ display:flex; align-items:baseline; gap:10px; min-width:0; }
.brand h1{ margin:0; font-size:21px; font-weight:800; letter-spacing:-.02em; }
.brand .ar{ font-family:var(--ar); font-size:20px; opacity:.75; line-height:1; }
.brand small{ display:block; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; opacity:.6; font-weight:600; margin-top:2px; }
.tools{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
.aa{ height:34px; min-width:40px; border:0; border-radius:999px; background:rgba(255,255,255,.1); color:inherit; cursor:pointer; display:flex; align-items:baseline; justify-content:center; gap:1px; padding:0 10px; font-weight:800; line-height:34px; }
.aa.icon{ width:34px; min-width:34px; padding:0; align-items:center; }
.aa.icon svg{ width:17px; height:17px; }
.aa .s1{ font-size:11px; } .aa .s2{ font-size:15px; }
.aa .lvl{ display:flex; gap:2px; align-self:center; margin-left:5px; }
.aa .lvl i{ width:4px; height:4px; border-radius:50%; background:currentColor; opacity:.3; }
.aa .lvl i.on{ opacity:1; }
@media (max-width:430px){ .brand .ar{ display:none; } .seg button{ padding:6px 10px; } .tools{ gap:6px; } }
@media (min-width:431px){ .brand small{ white-space:nowrap; } }
@media (max-width:400px){ .aa .lvl{ display:none; } .aa{ padding:0 8px; } }
.brand{ min-width:0; }
.step{ scroll-margin-top:150px; }
.step.current .card{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent), var(--shadow); }
.step.current .node{ border-color:var(--accent); color:var(--accent); }
.now-tag{ justify-self:start; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; font-weight:800; color:var(--accent); background:var(--accent-soft); padding:3px 9px; border-radius:99px; }
.resume{ width:100%; margin-top:14px; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:13px 16px; border:0; border-radius:14px; background:var(--accent); color:var(--accent-ink); cursor:pointer; text-align:left; box-shadow:var(--shadow); }
.resume small{ display:block; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; opacity:.75; font-weight:700; }
.resume b{ font-size:15px; }
.resume svg{ width:20px; height:20px; flex-shrink:0; }
.reset-row{ margin-top:28px; display:grid; gap:8px; justify-items:center; text-align:center; }
.reset-row p{ margin:0; font-size:13px; color:var(--muted); max-width:40ch; }
.btn.danger{ background:transparent; color:#B4452F; border-color:#E2B4A8; }
.saved{ margin:10px 0 0; font-size:12px; color:var(--faint); text-align:center; }
.seg{ display:flex; background:rgba(255,255,255,.1); border-radius:999px; padding:3px; flex-shrink:0; }
.seg button{ border:0; background:none; color:inherit; font-size:12.5px; font-weight:600; padding:6px 13px; border-radius:999px; cursor:pointer; opacity:.75; transition:background .2s, color .2s; }
.seg button[aria-pressed="true"]{ background:var(--header-ink); color:var(--header); opacity:1; }
.prog{ display:flex; align-items:center; gap:10px; font-size:12px; font-weight:600; font-variant-numeric:tabular-nums; }
.prog .track{ flex:1; height:4px; border-radius:99px; background:rgba(255,255,255,.14); overflow:hidden; }
.prog .fill{ height:100%; width:0; background:linear-gradient(90deg, #C9A04A, #EFD08A); border-radius:99px; transition:width .45s ease; }
.prog span{ opacity:.8; min-width:7ch; text-align:right; }

/* Section heading */
main{ padding-bottom:calc(96px + env(safe-area-inset-bottom,0px)); }
.heading{ padding-block:24px 6px; display:flex; justify-content:space-between; align-items:flex-end; gap:12px; }
.eyebrow{ font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--brass); font-weight:700; margin:0 0 4px; }
.heading h2{ margin:0; font-size:28px; line-height:1.15; font-weight:800; letter-spacing:-.025em; text-wrap:balance; }
.heading p.sub{ margin:4px 0 0; color:var(--muted); font-size:14px; }
.pill{ flex-shrink:0; font-size:12px; font-weight:700; padding:5px 10px; border-radius:99px; background:var(--accent-soft); color:var(--accent); font-variant-numeric:tabular-nums; white-space:nowrap; }
.pill.ok{ background:var(--ok-soft); color:var(--ok); }

/* Timeline */
.timeline{ list-style:none; margin:16px 0 0; padding:0; }
.step{ display:grid; grid-template-columns:36px 1fr; gap:14px; position:relative; padding-bottom:22px; }
.step::before{ content:""; position:absolute; left:17px; top:40px; bottom:4px; width:2px; background:var(--line); border-radius:2px; }
.step:last-child::before{ display:none; }
.node{ width:36px; height:36px; border-radius:50%; border:2px solid var(--line); background:var(--surface); display:grid; place-items:center; font-size:13px; font-weight:800; color:var(--muted); cursor:pointer; padding:0; transition:all .2s; font-variant-numeric:tabular-nums; }
.node svg{ width:16px; height:16px; }
.node.count{ border-color:var(--accent-soft); background:var(--accent-soft); color:var(--accent); cursor:default; }
.step.done .node{ background:var(--ok); border-color:var(--ok); color:#fff; }
.card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px; box-shadow:var(--shadow); min-width:0; display:grid; gap:12px; transition:opacity .2s; }
.step.done .card{ opacity:.55; box-shadow:none; }
.step-text{ margin:0; font-size:calc(16px * var(--zoom,1)); line-height:1.7; white-space:pre-line; font-weight:500; }
.note{ display:flex; gap:10px; align-items:flex-start; background:var(--surface-2); border-radius:12px; padding:10px 12px; }
.note svg{ flex-shrink:0; width:16px; height:16px; color:var(--brass); margin-top:3px; }
.note p{ margin:0; font-size:calc(14px * var(--zoom,1)); line-height:1.6; color:var(--ink); }

/* Dua */
.dua-box{ background:var(--brass-soft); border:1px solid var(--brass-line); border-radius:14px; padding:16px; display:grid; gap:8px; }
.dua-arabic{ font-family:var(--ar); font-size:calc(24px * var(--zoom,1)); line-height:2; text-align:right; direction:rtl; margin:0; color:var(--ink); }
.dua-roman{ margin:0; font-size:calc(14px * var(--zoom,1)); font-style:italic; color:var(--brass); line-height:1.6; }
.dua-meaning{ margin:0; font-size:calc(14px * var(--zoom,1)); line-height:1.6; color:var(--ink); }

/* Learn more */
details.more{ border-top:1px solid var(--line); padding-top:10px; }
details.more summary{ list-style:none; cursor:pointer; font-size:13.5px; font-weight:700; color:var(--accent); display:flex; align-items:center; gap:6px; }
details.more summary::-webkit-details-marker{ display:none; }
details.more summary svg{ width:14px; height:14px; transition:transform .2s; }
details.more[open] summary svg{ transform:rotate(90deg); }
.more-body{ margin-top:10px; display:grid; gap:8px; }
.more-body p{ margin:0; font-size:calc(14px * var(--zoom,1)); line-height:1.65; }
.more-body .hist{ padding-left:12px; border-left:2px solid var(--accent); color:var(--ink); }
.more-body ul{ margin:0; padding-left:18px; display:grid; gap:6px; }
.more-body li{ font-size:calc(14px * var(--zoom,1)); line-height:1.6; }
.more-body li::marker{ color:var(--brass); }

/* Buttons */
.btn{ justify-self:start; display:inline-flex; align-items:center; gap:8px; border-radius:99px; padding:9px 16px; font-size:13.5px; font-weight:700; cursor:pointer; border:1.5px solid var(--accent); background:var(--accent); color:var(--accent-ink); transition:all .2s; }
.btn svg{ width:15px; height:15px; }
.btn.ghost{ background:transparent; color:var(--muted); border-color:var(--line); }
.next{ width:100%; margin-top:10px; padding:16px 18px; border-radius:var(--r); border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:15px; font-weight:700; cursor:pointer; display:flex; justify-content:space-between; align-items:center; box-shadow:var(--shadow); }
.next.ready{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.next small{ display:block; font-size:11px; letter-spacing:.12em; text-transform:uppercase; opacity:.7; font-weight:700; text-align:left; }
.next svg{ width:20px; height:20px; }

/* Counter */
.counter{ background:var(--surface-2); border-radius:16px; padding:18px 16px; display:grid; gap:14px; justify-items:center; }
.ring{ position:relative; width:168px; height:168px; }
.ring svg{ width:100%; height:100%; transform:rotate(-90deg); }
.ring .seg-bg{ stroke:var(--line); }
.ring .seg-on{ stroke:var(--accent); transition:stroke .25s; }
.counter.complete .ring .seg-on{ stroke:var(--ok); }
.ring-center{ position:absolute; inset:0; display:grid; place-content:center; text-align:center; }
.ring-center b{ font-size:52px; line-height:1; font-weight:800; letter-spacing:-.03em; font-variant-numeric:tabular-nums; color:var(--accent); }
.counter.complete .ring-center b{ color:var(--ok); }
.ring-center span{ font-size:12px; color:var(--muted); font-weight:600; margin-top:4px; }
.counter-label{ margin:0; font-size:13px; font-weight:700; color:var(--muted); letter-spacing:.02em; }
.counter-btns{ display:flex; gap:10px; width:100%; }
.counter-btns button{ height:56px; border-radius:14px; cursor:pointer; font-weight:700; }
.minus{ width:56px; flex-shrink:0; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:24px; }
.minus:disabled{ opacity:.3; cursor:not-allowed; }
.add{ flex:1; border:0; background:var(--accent); color:var(--accent-ink); font-size:15.5px; }
.counter.complete .add{ background:var(--ok); color:#fff; cursor:default; }
.alh{ margin:0; font-family:var(--ar); font-size:22px; color:var(--ok); }

/* Completion */
.complete-card{ margin-top:18px; border-radius:20px; padding:28px 22px; text-align:center; color:#F1F7F5; background:radial-gradient(120% 120% at 50% 0%, #17635D 0%, #0B2E2B 70%); box-shadow:var(--shadow); }
.complete-card .ar{ font-family:var(--ar); font-size:32px; margin:0 0 6px; line-height:1.7; }
.complete-card .rom{ margin:0 0 4px; font-style:italic; font-size:16px; }
.complete-card p:last-child{ margin:0; font-size:14px; opacity:.8; }

/* Pre-read */
.intro{ margin:14px 0 0; color:var(--muted); font-size:calc(15px * var(--zoom,1)); line-height:1.65; max-width:62ch; }
.group{ margin:26px 0 10px; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--brass); font-weight:700; }
.stories{ display:grid; gap:10px; }
.story{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); overflow:hidden; }
.story.feature{ background:linear-gradient(180deg, var(--brass-soft), var(--surface) 80%); border-color:var(--brass-line); }
.story summary{ list-style:none; cursor:pointer; padding:15px 16px; display:grid; grid-template-columns:32px 1fr 16px; gap:12px; align-items:center; }
.story summary::-webkit-details-marker{ display:none; }
.badge{ width:32px; height:32px; border-radius:10px; display:grid; place-items:center; font-weight:800; font-size:13px; background:var(--accent-soft); color:var(--accent); font-variant-numeric:tabular-nums; }
.badge svg{ width:17px; height:17px; }
.story.read .badge{ background:var(--ok); color:#fff; }
.story.feature .badge{ background:var(--brass); color:var(--surface); }
.s-title{ margin:0; font-size:calc(16px * var(--zoom,1)); font-weight:700; line-height:1.35; }
.s-meta{ margin:2px 0 0; font-size:calc(13px * var(--zoom,1)); color:var(--muted); line-height:1.45; }
.chev{ width:16px; height:16px; color:var(--faint); transition:transform .2s; }
.story[open] .chev{ transform:rotate(90deg); }
.story-body{ padding:4px 16px 18px; border-top:1px solid var(--line); display:grid; gap:0; }
.story-body h4{ margin:20px 0 6px; font-size:calc(15px * var(--zoom,1)); font-weight:800; color:var(--accent); letter-spacing:-.01em; }
.story-body p{ margin:0 0 10px; font-size:calc(15px * var(--zoom,1)); line-height:1.75; }
.story-body ul{ margin:0 0 10px; padding-left:18px; display:grid; gap:6px; }
.story-body li{ font-size:calc(15px * var(--zoom,1)); line-height:1.7; margin-bottom:6px; }
.story-body li::marker{ color:var(--brass); }
.story-body .src{ font-size:12.5px; color:var(--muted); }
.story-body .dua-box{ margin:6px 0 14px; }
.live-it{ margin-top:14px; background:var(--accent-soft); border-radius:12px; padding:14px; }
.live-it h5{ margin:0 0 8px; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:800; }
.live-it ul{ margin:0; padding-left:16px; }
.live-it li{ font-size:calc(14px * var(--zoom,1)); line-height:1.6; margin-bottom:5px; }
.aside{ margin-top:14px; background:var(--brass-soft); border:1px solid var(--brass-line); border-radius:12px; padding:12px 14px; }
.aside p{ margin:0; font-size:calc(14px * var(--zoom,1)); line-height:1.65; }
.story .btn{ margin-top:16px; }
.short{ padding:0 16px 16px; display:grid; gap:8px; }
.short p{ margin:0; font-size:calc(15px * var(--zoom,1)); line-height:1.7; }
.where{ display:flex; gap:8px; align-items:flex-start; font-size:calc(13.5px * var(--zoom,1)); font-weight:600; color:var(--accent); }
.where svg{ flex-shrink:0; width:15px; height:15px; margin-top:3px; }
.carry{ margin-top:24px; border-radius:var(--r); padding:18px; background:var(--header); color:var(--header-ink); }
.carry h3{ margin:0 0 10px; font-size:15px; font-weight:800; }
.carry ul{ margin:0; padding-left:18px; display:grid; gap:6px; }
.carry li{ font-size:14px; line-height:1.6; opacity:.92; }

/* Bottom tab bar */
.tabbar{ position:fixed; left:0; right:0; bottom:0; z-index:30; background:color-mix(in srgb, var(--surface) 88%, transparent); -webkit-backdrop-filter:saturate(1.6) blur(16px); backdrop-filter:saturate(1.6) blur(16px); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px); }
.tabbar .wrap{ display:grid; grid-template-columns:repeat(5,1fr); }
.tab{ border:0; background:none; cursor:pointer; padding:9px 2px 10px; display:grid; justify-items:center; gap:3px; color:var(--faint); font-size:11px; font-weight:600; position:relative; }
.tab svg{ width:22px; height:22px; }
.tab.active{ color:var(--accent); }
.tab.active::before{ content:""; position:absolute; top:0; left:30%; right:30%; height:2.5px; border-radius:0 0 3px 3px; background:var(--accent); }
.tab .dot{ position:absolute; top:7px; right:calc(50% - 17px); width:8px; height:8px; border-radius:50%; background:var(--ok); border:2px solid var(--surface); }

@media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>

<script>
const SECTIONS = [
  { key:'preread',    label:'Pre-read', emoji:'📖', sub:'The stories behind the places' },
  { key:'ihram',      label:'Ihram',  emoji:'🌿', sub:'Before the Miqat' },
  { key:'tawaf',      label:'Tawaf',  emoji:'🕋', sub:'7 circuits'       },
  { key:'saee',       label:"Sa'ee",  emoji:'🏃‍♀️', sub:'7 laps'           },
  { key:'completion', label:'Done',   emoji:'✂️', sub:'Final step'       },
];

// ── Pre-read stories ──────────────────────────────────────────────────────────
const STORIES = [
  { id:'ibrahim', title:'Ibrahim, Ismail and Hajar', meta:'The origin of the Kaaba, sa\'ee and Zamzam', body:`
    <h4>The valley</h4>
    <p>Allah commanded Ibrahim (AS) to take his wife Hajar and their infant son Ismail to a barren valley with no water, no crops and no people. That valley became Makkah. He left them near the spot where the Kaaba would later stand, with only a bag of dates and a skin of water.</p>
    <p>As he walked away, Hajar followed him and asked again and again why he was leaving them there. He didn't answer. Finally she asked, <em>"Did Allah command you to do this?"</em> He said yes. She replied that, if so, Allah would not abandon them, and she returned to her son. Her certainty is the spirit of the whole pilgrimage. <span class="src">(Ibn Abbas, Sahih al-Bukhari 3364)</span></p>
    <h4>Ibrahim's du'a</h4>
    <p>Out of sight, Ibrahim turned toward the place of the House and prayed that Allah make people's hearts incline toward this valley and provide its people with fruits <span class="src">(Qur'an 14:37)</span>. Every crowd in the Haram, and every fruit stall in Makkah, is that du'a being answered.</p>
    <h4>The search between Safa and Marwah</h4>
    <p>When the water ran out, Hajar's milk dried up and Ismail began to cry in distress. She climbed Safa to look for anyone, saw no one, and came down. In the low part of the valley she hitched up her dress and <em>ran</em> until she reached Marwah, then climbed it and looked again. She did this seven times.</p>
    <h4>Zamzam</h4>
    <p>On the seventh round she heard a sound. An angel, Jibril, struck the ground near Ismail, and water burst out. Hajar hurried to contain it, building a basin around it with her hands. The Prophet ﷺ said that if she had left it alone, Zamzam would have become a flowing stream on the surface. Soon the Jurhum tribe passed by, saw birds circling, and asked her permission to settle. Makkah began as a town around this well.</p>
    <h4>The sacrifice</h4>
    <p>When Ismail was old enough to work beside his father, Ibrahim saw in a dream that he was sacrificing him. Ismail told him to do as he was commanded, and that he would find him patient <span class="src">(Qur'an 37:102)</span>. Both submitted, and Allah ransomed Ismail with a ram. This is the root of Eid al-Adha and of the stoning rituals of Hajj in Mina.</p>
    <h4>Building the House</h4>
    <p>Years later Ibrahim returned, and father and son raised the foundations of the Kaaba together. Ismail brought the stones and Ibrahim laid them. As the walls grew higher, Ibrahim stood on a stone to keep building. That stone is the <strong>Maqam Ibrahim</strong>, and his footprints are still visible in it. As they worked they prayed:</p>
    <div class="dua-box">
      <p class="dua-arabic">رَبَّنَا تَقَبَّلْ مِنَّا إِنَّكَ أَنْتَ السَّمِيعُ الْعَلِيمُ</p>
      <p class="dua-roman">Rabbanā taqabbal minnā, innaka antas-Samī'ul-'Alīm</p>
      <p class="dua-meaning">Our Lord, accept this from us; You are the All-Hearing, the All-Knowing. (Qur'an 2:127)</p>
    </div>
    <p>They also asked Allah to send a messenger from among their descendants <span class="src">(2:129)</span>. Muslims understand this du'a to have been fulfilled about 2,500 years later in the Prophet Muhammad ﷺ, a descendant of Ismail.</p>
    <p>Allah then commanded Ibrahim to call people to pilgrimage <span class="src">(22:27)</span>. Ibrahim asked how his voice could reach anyone, and Allah told him that his task was to call and that Allah would make it reach. Your Talbiyah is the answer to that call.</p>
    <div class="live-it"><h5>Where you'll live this story</h5><ul>
      <li><strong>Tawaf</strong> circles the House that Ibrahim and Ismail built.</li>
      <li><strong>The two rak'ahs after tawaf</strong> are prayed behind Maqam Ibrahim: "Take the station of Ibrahim as a place of prayer" (2:125).</li>
      <li><strong>Sa'ee</strong> retraces Hajar's steps. The green-lit section marks the low valley floor where she ran. You are walking the path of a mother's trust.</li>
      <li><strong>Zamzam</strong> is for whatever it is drunk for (Ibn Majah). Make a specific intention each time you drink.</li>
      <li><strong>Hijr Ismail</strong>, the semicircle beside the Kaaba, is part of the original House. Praying inside it counts as praying inside the Kaaba.</li>
    </ul></div>` },

  { id:'makkan', title:'The Makkan period', meta:'Revelation at Hira, persecution, the Year of Sorrow', body:`
    <h4>Before prophethood</h4>
    <p>The Prophet ﷺ was born in Makkah around 570 CE, in the Year of the Elephant. His father died before he was born, his mother when he was six, and his grandfather Abdul-Muttalib two years later. His uncle Abu Talib raised him. He became known as <strong>al-Amin</strong>, the trustworthy. At 25 he married <strong>Khadijah (RA)</strong>, a respected businesswoman who had employed him in trade.</p>
    <p>At around 35, the Quraysh rebuilt the Kaaba, and the clans nearly fought over who would set the Black Stone back in place. They agreed to let the next man to enter decide, and it was Muhammad ﷺ. He spread his cloak, placed the Stone on it, had a leader from each clan lift a corner, and then set the Stone in place with his own hands. The Black Stone you'll see was put in place by the Prophet ﷺ himself.</p>
    <h4>Hira</h4>
    <p>In his late thirties he began retreating to a small cave near the top of <strong>Jabal al-Nur</strong> to reflect and worship. In Ramadan of 610 CE, at age 40, the angel Jibril appeared and commanded him: <em>"Iqra!"</em> ("Read!"). He answered, "I am not one who reads." Jibril embraced him tightly and repeated the command, three times in all. Then came the first revealed verses:</p>
    <div class="dua-box">
      <p class="dua-arabic">اقْرَأْ بِاسْمِ رَبِّكَ الَّذِي خَلَقَ</p>
      <p class="dua-roman">Iqra' bismi rabbikal-ladhī khalaq</p>
      <p class="dua-meaning">Read in the name of your Lord who created. (Qur'an 96:1)</p>
    </div>
    <p>He came down trembling and went to Khadijah, saying, "Cover me, cover me." She reassured him: Allah would never disgrace him, because he kept family ties, helped the weak, gave to the poor, honored guests, and stood by people in hardship. She became the first person to believe in him. Her cousin <strong>Waraqah ibn Nawfal</strong>, an elderly Christian scholar, recognized this as the same angelic messenger sent to Musa, and warned that his people would drive him out. <span class="src">(Sahih al-Bukhari 3)</span></p>
    <h4>The call becomes public</h4>
    <p>After about three years of quiet preaching, the Prophet ﷺ climbed <strong>Safa</strong>, the same hill where you'll begin sa'ee, and called out to the clans of Quraysh. He asked whether they would believe him if he told them an army was behind the hill. They said yes, because they had never known him to lie. He told them he was a warner before a severe punishment. His uncle <strong>Abu Lahab</strong> cursed him, and Surah al-Masad (111) was revealed in response.</p>
    <h4>Persecution</h4>
    <ul>
      <li><strong>Bilal ibn Rabah</strong> was laid on the burning sand with a boulder on his chest. He would only repeat <em>"Ahad, Ahad"</em> ("One, One").</li>
      <li><strong>Sumayyah</strong>, mother of Ammar, became the first martyr of Islam. The Prophet ﷺ told her family to be patient, because their promised meeting place was Paradise.</li>
      <li>The Prophet ﷺ himself was mocked and called a madman. Once, while he was in sujood near the Kaaba, filth from a slaughtered camel was dumped on his back. His daughter Fatimah came and cleaned it off.</li>
      <li>Some Muslims migrated to <strong>Abyssinia</strong> under the just Christian king, the Najashi.</li>
      <li>The conversions of <strong>Hamza</strong> and then <strong>Umar</strong> gave the Muslims new strength.</li>
      <li>Around 616 CE the Quraysh imposed a <strong>boycott</strong>, confining the Prophet's clan to a valley for about three years. Hunger was so severe that people ate leaves.</li>
    </ul>
    <h4>The Year of Sorrow (619 CE)</h4>
    <p>Shortly after the boycott ended, Abu Talib died. He never accepted Islam, but he had protected his nephew all his life. Within weeks, <strong>Khadijah</strong> died: his wife of 25 years, his first believer and his greatest support. He remembered her with deep love for the rest of his life.</p>
    <h4>Ta'if</h4>
    <p>With his protection gone, he walked to Ta'if to seek support. Its leaders rejected him and set people on him who pelted him with stones until his feet bled. Resting in an orchard, he made a heartbreaking du'a: as long as Allah was not displeased with him, he did not care about anything else. The Angel of the Mountains offered to crush the city between two mountains. He refused, hoping that from their descendants would come people who worship Allah alone. That hope came true.</p>
    <p>Soon after came the <strong>Isra' and Mi'raj</strong>, the Night Journey from Masjid al-Haram to Jerusalem and the ascension through the heavens, where the five daily prayers were prescribed.</p>
    <h4>The way out</h4>
    <p>At the pilgrimage seasons, the Prophet ﷺ met people from Yathrib (Madinah). They pledged allegiance at <strong>Aqabah</strong> in 621 and 622, which opened the door to the Hijrah.</p>
    <div class="live-it"><h5>Where you'll see it</h5><ul>
      <li><strong>Jabal al-Nur</strong> is visible from much of Makkah. The hike to Hira is steep; go early in the morning. It isn't part of Umrah.</li>
      <li><strong>Jannat al-Mu'alla</strong> cemetery is where Khadijah is buried.</li>
      <li><strong>Safa</strong>, where you'll start sa'ee, is where he first preached openly.</li>
      <li>When you point to <strong>the Black Stone</strong>, remember whose hands set it in place.</li>
    </ul></div>` },

  { id:'hijrah', title:'The Hijrah', meta:'Cave Thawr, arrival at Quba, the stay with Abu Ayyub al-Ansari', body:`
    <h4>The plot</h4>
    <p>By 622 CE most Muslims had quietly left for Madinah. The Quraysh agreed that one young man from each clan would strike the Prophet ﷺ at once, so no single clan could be held responsible. Allah informed him of the plot. That night <strong>Ali (RA)</strong> slept in his bed under his green cloak, and stayed behind to return the valuables people had entrusted to the Prophet. Even his enemies trusted him with their belongings. The Prophet ﷺ walked out past the assassins at his door, reciting from Surah Ya-Sin (36:9), and they did not see him.</p>
    <h4>Cave Thawr</h4>
    <p>He and <strong>Abu Bakr (RA)</strong> headed <em>south</em> to Mount Thawr, the opposite direction from Madinah, and hid in a cave for three nights. The plan was careful:</p>
    <ul>
      <li>Abu Bakr's son <strong>Abdullah</strong> gathered news in Makkah by day and brought it to the cave at night.</li>
      <li>His freed slave <strong>Amir ibn Fuhayrah</strong> grazed sheep over their tracks to erase them.</li>
      <li>His daughter <strong>Asma</strong> brought food. She tore her waistband in two to tie up the provisions, and was honored as <em>Dhat an-Nitaqayn</em>, "she of the two waistbands."</li>
      <li>They hired a guide, <strong>Abdullah ibn Urayqit</strong>, who was not Muslim but was trustworthy.</li>
    </ul>
    <p>The Quraysh offered a bounty of 100 camels and sent trackers, who climbed right up to the cave's mouth. Abu Bakr whispered that if one of them looked down at his own feet, he would see them. The Prophet ﷺ answered, <em>"What do you think of two, when Allah is their third?"</em></p>
    <div class="dua-box">
      <p class="dua-arabic">لَا تَحْزَنْ إِنَّ اللَّهَ مَعَنَا</p>
      <p class="dua-roman">Lā taḥzan innallāha ma'anā</p>
      <p class="dua-meaning">Do not grieve; indeed Allah is with us. (Qur'an 9:40)</p>
    </div>
    <p class="src">You'll often hear that a spider spun a web and doves nested at the entrance. That story is widely loved, but its chains of narration are weaker than the core account.</p>
    <h4>The road</h4>
    <p>On the way north, <strong>Suraqa ibn Malik</strong> chased them hoping to collect the bounty. Three times his horse's legs sank into the sand. He asked for safety, and the Prophet ﷺ promised he would one day wear the bracelets of Kisra, the Persian emperor. Years later, under Umar's caliphate, Persia's treasures came to Madinah and Umar placed those bracelets on Suraqa's arms.</p>
    <h4>Quba</h4>
    <p>The Muslims of Madinah walked out every morning to the edge of the city and waited in the heat until midday. One day a man spotted the travelers and cried out, and the town rushed to greet them. The Prophet ﷺ stayed in <strong>Quba</strong> for several days and laid the foundation of the <strong>first mosque in Islam</strong>, described as founded on taqwa from the first day <span class="src">(9:108)</span>. He ﷺ later said that whoever purifies himself at home, then comes to Masjid Quba and prays there, receives the reward of an umrah <span class="src">(Ibn Majah, an-Nasa'i)</span>. He used to visit it every Saturday.</p>
    <h4>Entering Madinah</h4>
    <p>On the way in he led the first Jumu'ah prayer. Every family wanted to host him and grabbed at the reins of his camel, <strong>al-Qaswa</strong>. He told them to let her go, because she was under command. She knelt on a plot belonging to two orphans, Sahl and Suhayl. That land was purchased and became the site of <strong>Masjid an-Nabawi</strong>.</p>
    <h4>Abu Ayyub al-Ansari</h4>
    <p>The closest house belonged to <strong>Abu Ayyub (Khalid ibn Zayd)</strong>, and the Prophet ﷺ stayed there about seven months, until his rooms beside the mosque were finished. He chose the ground floor so visitors could reach him easily. Abu Ayyub and his wife were deeply uncomfortable sleeping above him. One night a jar of water broke upstairs, and they used their only blanket to soak it up so not a drop would drip on him. Abu Ayyub then begged him to switch floors, and he agreed. When food was sent back down, they would look for the places the Prophet's fingers had touched and eat from there.</p>
    <div class="aside"><p>🔗 <strong>A link to your trip:</strong> Decades later, as an old man, Abu Ayyub joined the army besieging Constantinople and died there around 672 CE, asking to be buried as close to the walls as possible. His tomb is the <strong>Eyüp Sultan Mosque</strong> in Istanbul. Visiting it after Madinah ties the two halves of your trip together: where he hosted the Prophet ﷺ, and where he was laid to rest.</p></div>
    <div class="live-it"><h5>Where you'll see it</h5><ul>
      <li><strong>Masjid Quba:</strong> make wudu at the hotel first, then go, for the reward of an umrah.</li>
      <li><strong>Masjid an-Nabawi</strong> stands on the orphans' land where al-Qaswa knelt.</li>
      <li><strong>Mount Thawr</strong> is south of Makkah; worth seeing on a ziyarah drive.</li>
      <li><strong>Eyüp Sultan Mosque</strong> in Istanbul.</li>
    </ul></div>` },
];

const KAABA = { title:'Looking at the Ka\'bah', meta:'The reward, what it means, and how to take it in', body:`
    <h4>The first sight</h4>
    <p>You've faced this building in every prayer of your life without seeing it. When it first comes into view, don't rush to start tawaf or take out your phone. Stop, raise your hands, and ask. Many scholars held that du'a at the first sight of the Ka'bah is especially hoped to be answered. Decide in advance what you'll ask for first, so the moment doesn't pass in a blur.</p>
    <p>Some early generations would say a du'a like this on seeing it. Its chain to the Prophet ﷺ is weak, so say it as a beautiful du'a rather than a sunnah:</p>
    <div class="dua-box">
      <p class="dua-arabic">اللّٰهُمَّ زِدْ هٰذَا الْبَيْتَ تَشْرِيفًا وَتَعْظِيمًا وَتَكْرِيمًا وَمَهَابَةً</p>
      <p class="dua-roman">Allāhumma zid hādhal-bayta tashrīfan wa ta'ẓīman wa takrīman wa mahābah</p>
      <p class="dua-meaning">O Allah, increase this House in honor, greatness, nobility and awe.</p>
    </div>
    <h4>The reward for looking at it</h4>
    <p>Simply looking at the Ka'bah is counted as worship.</p>
    <p>A narration from Ibn Abbas describes how the mercy is shared out:</p>
    <div class="dua-box">
      <p class="dua-meaning">"Allah sends down upon this House one hundred and twenty mercies every day: sixty for those making tawaf, forty for those praying, and twenty for those looking at it."</p>
      <p class="dua-roman" style="margin:8px 0 0">al-Tabarani; al-Bayhaqi, Shu'ab al-Iman</p>
    </div>
    <p>Its chain is graded weak by hadith scholars, so it isn't certain the Prophet ﷺ said it. Many scholars still cite it to encourage good deeds, and its meaning matches what early scholars taught. It also shows that every way of being near the House earns mercy: when you're too tired for another tawaf, or the mataf is too packed, sitting and looking still counts.</p>
    <p>Sa'id ibn al-Musayyib, one of the great early scholars, said that whoever looks at the Ka'bah with faith and sincerity has his sins fall away like leaves from a tree.</p>
    <h4>The angels' tawaf above you</h4>
    <p>On the Night Journey, the Prophet ﷺ was shown <strong>al-Bayt al-Ma'mur</strong>, the "Frequented House" in the seventh heaven. Seventy thousand angels enter it every day to worship, and they never return to it again, because their turn never comes back (Sahih al-Bukhari 3207; Sahih Muslim 162). Allah swears by it in Surah at-Tur (52:4). Early commentators described it as lying directly above the Ka'bah, so that if it fell, it would fall onto it.</p>
    <p>So when you join the tawaf, you are not only joining the crowd around you. You are mirroring a worship that goes on, without pause, in the heavens above. And the person the Prophet ﷺ saw sitting with his back against al-Bayt al-Ma'mur was <strong>Ibrahim (AS)</strong>, the builder of the House you are circling.</p>
    <h4>It never stops</h4>
    <p>Apart from the moments of congregational prayer, tawaf around the Ka'bah almost never stops, day or night, heat or rain. People have circled it for thousands of years, since Ibrahim and Ismail. When you step into the flow, you join a line that runs back through the Prophet ﷺ, the companions, and every pilgrim since, and that will carry on after you leave.</p>
    <h4>What it means</h4>
    <ul>
      <li><strong>Simplicity.</strong> It is a plain cube of stone, empty inside. There is no image or statue to look at. The point is not the building; it is the One it belongs to. Surah Quraysh calls Allah <em>"the Lord of this House"</em> (106:3).</li>
      <li><strong>The first House.</strong> "The first House set up for mankind is the one at Bakkah, blessed and a guidance for the worlds" (3:96).</li>
      <li><strong>The center of every circle.</strong> Everywhere else, Muslims pray in straight rows. Here, and only here, the rows bend into rings around one point. You can see people praying toward you from the other side. This is what the whole ummah looks like from above.</li>
      <li><strong>The answer to a du'a.</strong> Ibrahim asked Allah to make hearts incline toward this valley (14:37). Your own longing to be here is part of that answer.</li>
    </ul>
    <h4>Something greater than the Ka'bah</h4>
    <p>Ibn Umar reported that the Prophet ﷺ looked at the Ka'bah and said: <em>"How pure you are, how pure your fragrance; how great you are and how great your sanctity. But by Him in whose hand is Muhammad's soul, the sanctity of a believer is greater with Allah than yours: his wealth, his blood, and to think anything but good of him."</em> (Ibn Majah 3932)</p>
    <p>Remember this in the crowd. Pushing someone to reach the Black Stone or to get closer to the wall trades something greater for something lesser.</p>
    <h4>Details to look for</h4>
    <ul>
      <li><strong>The kiswah:</strong> the black silk cover, with Qur'anic verses woven in gold thread around its upper band. It is replaced every year.</li>
      <li><strong>The door:</strong> on the east wall, raised above the ground, covered in gold. Its key is still held by the Banu Shaybah family.</li>
      <li><strong>The Multazam:</strong> the stretch of wall between the Black Stone and the door, where companions pressed themselves and made du'a.</li>
      <li><strong>The Mizab:</strong> the golden rain spout on the roof, draining into the Hijr Ismail.</li>
      <li><strong>The two corners on Ibrahim's foundations:</strong> the Black Stone corner and the Yemeni corner. The other two follow the Quraysh rebuild, which left out the Hijr.</li>
    </ul>
    <h4>Ways to take it in</h4>
    <ul>
      <li><strong>Just sit and look.</strong> Looking is worship in itself, so give yourself time with no task: no tawaf, no reading, only looking, dhikr and du'a.</li>
      <li><strong>Try different times and levels.</strong> After Fajr as the sky lightens, and late at night when the marble is cool and the crowd thins. From the upper floors and the roof you see the whole ring of tawaf moving at once.</li>
      <li><strong>Pick a spot facing the Multazam or the door</strong> after a prayer, and stay a while.</li>
      <li><strong>Limit photos.</strong> Take a few, then put the phone away. The image you keep in your heart matters more than the one in your camera roll.</li>
      <li><strong>Think of everyone who faces it.</strong> At every moment, somewhere in the world, people are praying toward this exact spot. Make du'a for them, and for the people back home who asked you to remember them.</li>
      <li><strong>Return to it on your last day.</strong> Look at it once more before your farewell tawaf, and ask Allah to bring you back.</li>
    </ul>
    <div class="live-it"><h5>When you're there</h5><ul>
      <li>First sight: stop, raise your hands, ask before anything else.</li>
      <li>During tawaf: remember the angels circling al-Bayt al-Ma'mur above you.</li>
      <li>In the crowd: the believer next to you is more sacred than the wall.</li>
      <li>Afterward: sit and simply look, as worship.</li>
    </ul></div>` };

const esc = t => String(t);

// ── State ─────────────────────────────────────────────────────────────────────
let activeSection = 'preread';
let openStory = null;
let checked  = {};
let counters = { tawaf: 0, saee: 0 };
// Progress is saved on this phone after every change, so a reload or a locked screen never loses your place.
try {
  const pr = JSON.parse(localStorage.getItem('sabrina-progress') || 'null');
  if (pr && typeof pr === 'object') {
    if (pr.checked && typeof pr.checked === 'object') checked = pr.checked;
    if (pr.counters) counters = { tawaf: Math.min(7, +pr.counters.tawaf || 0), saee: Math.min(7, +pr.counters.saee || 0) };
  }
} catch (e) {}
// Light by default; the header button switches to dark and the choice is remembered.
let theme = 'light';
try { if (localStorage.getItem('sabrina-theme') === 'dark') theme = 'dark'; } catch (e) {}
document.documentElement.setAttribute('data-theme', theme);
const SIZES = [1, 1.15, 1.3];
let textSize = 0;
try { const ts = +localStorage.getItem('sabrina-size'); if (ts >= 0 && ts < SIZES.length) textSize = ts; } catch (e) {}
let gender = 'f';
let readStories = {};
try { readStories = JSON.parse(localStorage.getItem('sabrina-preread') || '{}') || {}; } catch (e) { readStories = {}; }
try { const t = localStorage.getItem('sabrina-tab'); if (t && SECTIONS.some(s => s.key === t)) activeSection = t; } catch (e) {}
const store = (k, v) => { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } };
let saveOk = true;
function saveProgress() { saveOk = store('sabrina-progress', JSON.stringify({ checked, counters, savedAt: Date.now() })); }
function hasProgress() { return Object.values(checked).some(Boolean) || counters.tawaf > 0 || counters.saee > 0; }

// Pick the gender-specific value of a field, if it has one.
function g(v) { return (v && typeof v === 'object' && !Array.isArray(v) && ('m' in v || 'f' in v)) ? v[gender] : v; }
function stepsFor(sec) { return STEPS.filter(s => (!sec || s.section === sec) && (!s.only || s.only === gender)); }
function isDone(s) { return s.isCounter ? counters[s.counterKey] >= 7 : !!checked[s.id]; }

function sectionDone(key) {
  if (key === 'preread') return STORIES.every(s => readStories[s.id]);
  return stepsFor(key).every(isDone);
}
function totalProgress() {
  const all = stepsFor().filter(s => s.section !== 'preread');
  const done = all.filter(isDone).length;
  return { done, total: all.length, pct: Math.round(done / all.length * 100) };
}
function currentStep() { return stepsFor().find(s => !isDone(s)) || null; }
function scrollToStep(id, smooth) {
  const el = document.getElementById('step-' + id);
  if (el) el.scrollIntoView({ block: 'start', behavior: smooth ? 'smooth' : 'auto' });
}
// Toggle a step, then glide to the next one if it is in the same section.
function toggleStep(step) {
  checked[step.id] = !checked[step.id];
  render();
  if (checked[step.id]) { const cur = currentStep(); if (cur && cur.section === activeSection) scrollToStep(cur.id, true); }
}
function resumeCurrent() { const cur = currentStep(); if (!cur) return; activeSection = cur.section; store('sabrina-tab', cur.section); render(); scrollToStep(cur.id, false); }
function stepNum(id) { return stepsFor().filter(s => !s.isCounter).findIndex(s => s.id === id) + 1; }

function goTo(key, storyId) {
  activeSection = key; store('sabrina-tab', key);
  if (storyId) openStory = storyId;
  render(); window.scrollTo(0, 0);
}

// Keep the screen awake while counting circuits and laps.
let wakeLock = null;
async function keepAwake() {
  try { if (!wakeLock && navigator.wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && (counters.tawaf || counters.saee)) keepAwake(); });
function buzz() { try { navigator.vibrate && navigator.vibrate(25); } catch (e) {} }

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  saveProgress();
  document.documentElement.setAttribute('data-theme', theme);
  const tb = document.getElementById('theme');
  tb.innerHTML = theme === 'dark'
    ? svg('<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/>', 'stroke-width="2"')
    : svg('<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>', 'stroke-width="2"');
  tb.setAttribute('aria-label', theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
  document.documentElement.style.setProperty('--zoom', SIZES[textSize]);
  document.querySelectorAll('#aa .lvl i').forEach((i, k) => i.classList.toggle('on', k <= textSize));
  document.getElementById('aa').setAttribute('aria-label', 'Text size: ' + ['normal', 'large', 'extra large'][textSize] + '. Tap to change.');
  document.querySelectorAll('#gender button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.g === gender)));
  const { pct } = totalProgress();
  document.getElementById('fill').style.width = pct + '%';
  document.getElementById('pct').textContent = pct + '% done';
  renderTabs(); renderHeading();
  if (activeSection === 'preread') renderPreread(); else renderSteps();
  renderResume();
}

// When you're on a different tab from where you left off, offer a one-tap way back.
function renderResume() {
  const cur = currentStep();
  if (!cur || !hasProgress() || cur.section === activeSection) return;
  const sec = SECTIONS.find(s => s.key === cur.section);
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'resume';
  const label = cur.isCounter ? (cur.counterKey === 'tawaf' ? `Circuit ${counters.tawaf + 1} of 7` : `Lap ${counters.saee + 1} of 7`) : `Step ${stepNum(cur.id)}`;
  b.innerHTML = `<span><small>Continue where you left off</small><b>${sec.label} · ${label}</b></span>${ICON.arrow}`;
  b.onclick = resumeCurrent;
  const c = document.getElementById('content');
  c.insertBefore(b, c.firstChild);
}

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = '';
  SECTIONS.forEach(sec => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'tab' + (sec.key === activeSection ? ' active' : '');
    if (sec.key === activeSection) b.setAttribute('aria-current', 'page');
    b.innerHTML = ICON[sec.key] + `<span>${sec.label}</span>` + (sectionDone(sec.key) ? '<i class="dot" aria-label="done"></i>' : '');
    b.onclick = () => goTo(sec.key);
    el.appendChild(b);
  });
}

function renderHeading() {
  const sec = SECTIONS.find(s => s.key === activeSection);
  const rites = SECTIONS.filter(s => s.key !== 'preread');
  const idx = rites.findIndex(s => s.key === activeSection);
  document.getElementById('eyebrow').textContent = activeSection === 'preread' ? 'Before you go' : `Part ${idx + 1} of ${rites.length}`;
  document.getElementById('title').textContent = sec.key === 'completion' ? 'Finish' : sec.label;
  document.getElementById('sub').textContent = sec.sub;
  const pill = document.getElementById('count');
  if (activeSection === 'preread') {
    const n = STORIES.filter(s => readStories[s.id]).length;
    pill.textContent = n + ' of ' + STORIES.length + ' read';
    pill.className = 'pill' + (n === STORIES.length ? ' ok' : '');
  } else {
    const v = stepsFor(activeSection);
    const d = v.filter(isDone).length;
    pill.textContent = d + ' of ' + v.length + ' done';
    pill.className = 'pill' + (d === v.length ? ' ok' : '');
  }
}

function nextButton(container, label, ready, onclick) {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'next' + (ready ? ' ready' : '');
  b.innerHTML = `<span><small>${ready ? 'Next' : 'Skip to'}</small>${label}</span>${ICON.arrow}`;
  b.onclick = onclick;
  container.appendChild(b);
}

function renderSteps() {
  const c = document.getElementById('content');
  c.innerHTML = '';
  const ol = document.createElement('ol');
  ol.className = 'timeline';
  const cur = currentStep();
  const hasProgressOrStarted = hasProgress() || activeSection !== 'preread';

  stepsFor(activeSection).forEach(step => {
    const done = isDone(step);
    const li = document.createElement('li');
    const isCur = cur && cur.id === step.id && hasProgressOrStarted;
    li.className = 'step' + (done ? ' done' : '') + (isCur ? ' current' : '');
    li.id = 'step-' + step.id;

    const node = document.createElement('button');
    node.type = 'button';
    if (step.isCounter) {
      node.className = 'node count';
      node.innerHTML = done ? ICON.check : '7';
      node.tabIndex = -1;
      node.setAttribute('aria-hidden', 'true');
    } else {
      node.className = 'node';
      node.innerHTML = done ? ICON.check : stepNum(step.id);
      node.setAttribute('aria-label', done ? 'Mark step as not done' : 'Mark step as done');
      node.onclick = () => toggleStep(step);
    }
    li.appendChild(node);

    const card = document.createElement('div');
    card.className = 'card';
    if (isCur) { const t = document.createElement('span'); t.className = 'now-tag'; t.textContent = 'You are here'; card.appendChild(t); }
    const p = document.createElement('p');
    p.className = 'step-text';
    p.textContent = g(step.text);
    card.appendChild(p);

    if (step.note) card.appendChild(makeNote(g(step.note)));
    if (step.notes) g(step.notes).forEach(n => card.appendChild(makeNote(n)));
    if (step.dua) card.appendChild(makeDua(step.dua));
    if (step.isCounter) card.appendChild(makeCounter(step));
    if (step.detail) card.appendChild(makeMore(step.detail));

    if (!step.isCounter) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn' + (done ? ' ghost' : '');
      b.innerHTML = done ? `${ICON.check}<span>Done · tap to undo</span>` : `${ICON.check}<span>Mark as done</span>`;
      b.onclick = () => toggleStep(step);
      card.appendChild(b);
    }
    li.appendChild(card);
    ol.appendChild(li);
  });
  c.appendChild(ol);

  const i = SECTIONS.findIndex(s => s.key === activeSection);
  if (i < SECTIONS.length - 1) {
    const nx = SECTIONS[i + 1];
    nextButton(c, nx.label, sectionDone(activeSection), () => goTo(nx.key));
  }

  const prog = totalProgress();
  if (prog.done === prog.total) {
    const card = document.createElement('div');
    card.className = 'complete-card';
    card.innerHTML = `
      <p class="ar" lang="ar">${gender === 'm' ? 'تَقَبَّلَ اللّٰهُ مِنْكَ' : 'تَقَبَّلَ اللّٰهُ مِنْكِ'}</p>
      <p class="rom">${gender === 'm' ? 'Taqabbalallāhu minka' : 'Taqabbalallāhu minki'}</p>
      <p>May Allah accept your Umrah.</p>`;
    c.appendChild(card);
  }

  const note = document.createElement('p');
  note.className = 'saved';
  note.textContent = saveOk ? 'Your progress is saved on this phone.' : 'This browser is blocking storage, so progress resets if the page reloads.';
  c.appendChild(note);

  if (activeSection === 'completion') {
    const row = document.createElement('div');
    row.className = 'reset-row';
    row.innerHTML = `<p>Doing another Umrah? Clear every tick and counter and start again from Ihram.</p>`;
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'btn danger';
    b.textContent = 'Start a new Umrah';
    b.onclick = () => {
      if (!b.dataset.armed) { b.dataset.armed = '1'; b.textContent = 'Tap again to clear everything'; setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = 'Start a new Umrah'; } }, 4000); return; }
      checked = {}; counters = { tawaf: 0, saee: 0 }; goTo('ihram');
    };
    row.appendChild(b);
    c.appendChild(row);
  }
}

function makeNote(text) {
  const d = document.createElement('div');
  d.className = 'note';
  d.innerHTML = `${ICON.info}<p>${text}</p>`;
  return d;
}

function makeDua(dua) {
  const d = document.createElement('div');
  d.className = 'dua-box';
  d.innerHTML = `<p class="dua-arabic" lang="ar">${dua.arabic}</p><p class="dua-roman">${dua.roman}</p><p class="dua-meaning">${dua.meaning}</p>`;
  return d;
}

function makeMore(detail) {
  const d = document.createElement('details');
  d.className = 'more';
  let body = '';
  if (detail.history) body += `<p class="hist">${detail.history}</p>`;
  const tips = g(detail.tips);
  if (tips && tips.length) body += `<ul>${tips.map(t => `<li>${t}</li>`).join('')}</ul>`;
  d.innerHTML = `<summary>${ICON.chevS}<span>Learn more</span></summary><div class="more-body">${body}</div>`;
  d.addEventListener('toggle', () => { d.querySelector('summary span').textContent = d.open ? 'Hide details' : 'Learn more'; });
  return d;
}

function makeCounter(step) {
  const key = step.counterKey, n = counters[key], total = 7, done = n >= total;
  const unit = key === 'tawaf' ? 'circuit' : 'lap';
  const r = 52, C = 2 * Math.PI * r, gap = 15, seg = C / total - gap;
  let rings = '';
  for (let i = 0; i < total; i++) {
    const off = -(i * C / total);
    rings += `<circle cx="60" cy="60" r="${r}" fill="none" stroke-width="9" stroke-linecap="round" class="${i < n ? 'seg-on' : 'seg-bg'}" stroke-dasharray="${seg} ${C - seg}" stroke-dashoffset="${off}"/>`;
  }
  const d = document.createElement('div');
  d.className = 'counter' + (done ? ' complete' : '');
  d.innerHTML = `
    <div class="ring" role="img" aria-label="${n} of ${total} ${unit}s complete">
      <svg viewBox="0 0 120 120">${rings}</svg>
      <div class="ring-center"><b>${n}</b><span>of ${total} ${unit}s</span></div>
    </div>
    <p class="counter-label">${key === 'tawaf' ? "Circuits around the Ka'bah" : 'Laps between Safa and Marwa'}</p>
    <div class="counter-btns">
      <button type="button" class="minus" aria-label="Undo last ${unit}" ${n === 0 ? 'disabled' : ''}>−</button>
      <button type="button" class="add">${done ? 'Complete' : `Complete ${unit} ${n + 1}`}</button>
    </div>
    ${done ? '<p class="alh" lang="ar">الحمد لله</p>' : ''}`;
  d.querySelector('.minus').onclick = () => { if (counters[key] > 0) { counters[key]--; render(); } };
  d.querySelector('.add').onclick = () => { if (counters[key] < total) { counters[key]++; buzz(); keepAwake(); render(); if (counters[key] >= total) { const cur = currentStep(); if (cur && cur.section === activeSection) scrollToStep(cur.id, true); } } };
  return d;
}

function storyCard(opts) {
  const d = document.createElement('details');
  d.className = 'story' + (opts.cls ? ' ' + opts.cls : '');
  if (opts.id) d.id = 'story-' + opts.id;
  if (opts.id && openStory === opts.id) d.open = true;
  d.innerHTML = `
    <summary>
      <span class="badge">${opts.badge}</span>
      <span><p class="s-title">${opts.title}</p>${opts.meta ? `<p class="s-meta">${opts.meta}</p>` : ''}</span>
      ${ICON.chev}
    </summary>
    <div class="${opts.bodyCls || 'story-body'}">${opts.body}</div>`;
  if (opts.id) d.addEventListener('toggle', () => { if (d.open) openStory = opts.id; else if (openStory === opts.id) openStory = null; });
  return d;
}

function renderPreread() {
  const c = document.getElementById('content');
  c.innerHTML = '';
  const intro = document.createElement('p');
  intro.className = 'intro';
  intro.textContent = 'Read these before you fly. Each rite of Umrah retraces something that happened in these places, and knowing the story turns the steps into memories.';
  c.appendChild(intro);

  const label = t => { const p = document.createElement('p'); p.className = 'group'; p.textContent = t; c.appendChild(p); };
  const list = () => { const l = document.createElement('div'); l.className = 'stories'; c.appendChild(l); return l; };

  label("Before you see the Ka'bah");
  list().appendChild(storyCard({ id:'kaaba', cls:'feature', badge:ICON.kaaba, title:KAABA.title, meta:KAABA.meta, body:KAABA.body }));

  label('Focus stories');
  const l2 = list();
  STORIES.forEach((s, i) => {
    const read = !!readStories[s.id];
    const card = storyCard({ id:s.id, cls: read ? 'read' : '', badge: read ? ICON.check : i + 1, title:s.title, meta:s.meta, body:s.body });
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'btn' + (read ? ' ghost' : '');
    b.innerHTML = `${ICON.check}<span>${read ? 'Read · tap to undo' : 'Mark as read'}</span>`;
    b.onclick = () => {
      readStories[s.id] = !readStories[s.id];
      store('sabrina-preread', JSON.stringify(readStories));
      openStory = readStories[s.id] ? null : s.id;
      render();
      const el = document.getElementById('story-' + s.id);
      if (el) el.scrollIntoView({ block: 'center' });
    };
    card.querySelector('.story-body').appendChild(b);
    l2.appendChild(card);
  });

  label('More stories for the journey');
  const l3 = list();
  MORE.forEach((m, i) => {
    l3.appendChild(storyCard({ badge: ICON.preread, title:m.title, bodyCls:'short',
      body:`<p>${m.text}</p><p class="where">${ICON.pin}<span>${g(m.where)}</span></p>` }));
  });

  const t = document.createElement('div');
  t.className = 'carry';
  t.innerHTML = `<h3>Carry these with you</h3><ul>${TAKEAWAYS.map(x => `<li>${x}</li>`).join('')}</ul>`;
  c.appendChild(t);

  nextButton(c, 'Begin with Ihram', true, () => goTo('ihram'));
}

document.querySelectorAll('#gender button').forEach(b => {
  b.onclick = () => { if (gender !== b.dataset.g) { gender = b.dataset.g; store('sabrina-gender', gender); render(); } };
});
document.getElementById('theme').onclick = () => { theme = theme === 'dark' ? 'light' : 'dark'; store('sabrina-theme', theme); render(); };
document.getElementById('aa').onclick = () => { textSize = (textSize + 1) % SIZES.length; store('sabrina-size', String(textSize)); render(); };

// On reopening mid-Umrah, land on the step you're up to.
if (hasProgress() && currentStep()) { activeSection = currentStep().section; render(); scrollToStep(currentStep().id, false); }
else render();

// Offline cache when hosted on its own site (e.g. GitHub Pages). Skipped inside Claude.
try {
  if ('serviceWorker' in navigator && location.protocol === 'https:' && !/(^|\.)claude\.(ai|com)$|claudeusercontent|anthropic/.test(location.hostname)) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
} catch (e) {}
</script>

</body></html>
